<section class="planche draw" aria-labelledby="h1">
  <div class="wrap">
    <nav class="crumbs" aria-label="Fil d'Ariane"><ol>{% for h, l in crumbs %}<li>{% if loop.last %}<span aria-current="page">{{ l }}</span>{% else %}<a href="{{ h }}">{{ l }}</a>{% endif %}</li>{% endfor %}</ol></nav>
    <h1 id="h1">{{ p.h1 }}</h1>
    {% if p.lede or p.answer %}<p class="lede">{{ (p.lede or p.answer) | safe }}</p>{% endif %}
    {% if p.cta %}<div class="ctas"><a class="btn btn-vitrine" href="{{ p.cta_href or '/etudier-mon-projet' }}">{{ p.cta }}</a>{% if p.cta2 %}<a class="btn btn-line" href="{{ p.cta2[0] }}">{{ p.cta2[1] }}</a>{% endif %}</div>{% endif %}
  </div>
</section>
